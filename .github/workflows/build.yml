# =============================================================================
#  Build & push de l'image zrepl — linux/amd64 + linux/arm64
# =============================================================================
#  Une seule image, deux architectures : le manifeste multi-arch est pousse sur
#  GHCR. Le binaire zrepl etant statique et publie par l'amont pour les deux
#  architectures, il n'y a ni QEMU ni cross-compilation a mettre en place.
#
#  Publiee sur : ghcr.io/jbaptisme33/zrepl
#  Tags         : <version zrepl> (ex. 0.7.0), latest (branche par defaut), sha-<court>
#
#  La version de zrepl est declaree UNE SEULE FOIS (env.ZREPL_VERSION), et sert
#  a la fois de build-arg et de tag d'image : les deux ne peuvent pas diverger.
# =============================================================================
name: Build & push zrepl image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # -- Version de zrepl embarquee. Bump = un commit ici (voir README).
  ZREPL_VERSION: "0.7.0"
  # -- Depot amont du binaire.
  ZREPL_REPO: zrepl/zrepl
  IMAGE: ghcr.io/jbaptisme33/zrepl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # -- QEMU n'est PAS necessaire (aucune execution d'un binaire etranger :
      #    le binaire est telecharge, pas execute pendant le build). On
      #    l'installe malgre tout : il couvre une future etape de verification
      #    (`docker run` sur l'autre architecture) sans changer le build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.ZREPL_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ env.ZREPL_VERSION }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ZREPL_VERSION=${{ env.ZREPL_VERSION }}
            ZREPL_REPO=${{ env.ZREPL_REPO }}
          provenance: true
          sbom: true
